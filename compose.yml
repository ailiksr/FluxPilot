services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miniflux}
      POSTGRES_USER: ${POSTGRES_USER:-miniflux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miniflux_secret}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [rss]

  image-proxy:
    image: ghcr.io/ailiksr/fluxpilot-image-proxy:${TAG:-latest}
    restart: unless-stopped
    environment:
      TIMEOUT: "30"
      MAX_BYTES: "15728640"
      MAX_CACHE_BYTES: "536870912"
      ALLOW_SVG: "0"
    volumes:
      - ./data/image-proxy:/cache
    ports:
      - "${PORT_IMAGE_PROXY:-18091}:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [rss]

  miniflux:
    image: miniflux/miniflux:2.2.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      image-proxy:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-miniflux}:${POSTGRES_PASSWORD:-miniflux_secret}@postgres:5432/${POSTGRES_DB:-miniflux}?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${MINIFLUX_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD:-admin_secret}
      BASE_URL: http://${HOST_IP:-${LAN_IP:-127.0.0.1}}:${PORT_MINIFLUX:-18080}
      INTEGRATION_ALLOW_PRIVATE_NETWORKS: "1"
      FETCHER_ALLOW_PRIVATE_NETWORKS: "1"
      TZ: ${TZ:-Asia/Shanghai}
      MEDIA_PROXY_MODE: none
      HTTP_CLIENT_USER_AGENT: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36
    ports:
      - "${PORT_MINIFLUX:-18080}:8080"
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [rss]

  miniflux-ai:
    image: ghcr.io/ailiksr/fluxpilot-worker:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      miniflux:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIFLUX_ADMIN_USER: ${MINIFLUX_ADMIN_USER:-admin}
      MINIFLUX_ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD:-admin_secret}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-miniflux}
      PGUSER: ${POSTGRES_USER:-miniflux}
      PGPASSWORD: ${POSTGRES_PASSWORD:-miniflux_secret}
      HOST_IP: ${HOST_IP:-${LAN_IP:-127.0.0.1}}
      PORT_AI_CONSOLE: ${PORT_AI_CONSOLE:-18090}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_WEBHOOK_SECRET: ${AI_WEBHOOK_SECRET:-}
    volumes:
      - ./data/ai-worker:/app/data
    ports:
      - "${PORT_AI_CONSOLE:-18090}:80"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [rss]

  reactflux:
    image: electh/reactflux:latest
    restart: unless-stopped
    depends_on:
      miniflux:
        condition: service_healthy
    ports:
      - "${PORT_REACTFLUX:-13000}:2000"
    networks: [rss]

networks:
  rss:
    name: rss
